<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş — Mantı Takip</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Inter', BlinkMacSystemFont, sans-serif;
  background: #F5F5F7;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}
.login-wrap {
  width: 100%;
  max-width: 360px;
  padding: 20px;
}
.login-card {
  background: #fff;
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 18px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.06);
  padding: 36px 32px 32px;
}
.login-icon {
  width: 56px; height: 56px;
  background: linear-gradient(145deg, #0071E3, #42A5F5);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  margin: 0 auto 18px;
  box-shadow: 0 4px 16px rgba(0,113,227,0.3);
}
.login-title {
  font-size: 20px;
  font-weight: 700;
  color: #1D1D1F;
  text-align: center;
  letter-spacing: -0.3px;
  margin-bottom: 4px;
}
.login-sub {
  font-size: 12px;
  color: #98989D;
  text-align: center;
  margin-bottom: 26px;
}
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: #6E6E73;
  margin-bottom: 6px;
}
.form-control {
  width: 100%;
  padding: 10px 13px;
  background: #F5F5F7;
  border: 1px solid rgba(0,0,0,0.12);
  border-radius: 9px;
  font-size: 14px;
  font-family: inherit;
  color: #1D1D1F;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  margin-bottom: 14px;
}
.form-control:focus {
  border-color: #0071E3;
  box-shadow: 0 0 0 3px rgba(0,113,227,0.12);
  background: #fff;
}
.form-control::placeholder { color: #C7C7CC; }
.btn-login {
  width: 100%;
  padding: 11px;
  background: #0071E3;
  color: #fff;
  border: none;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
  margin-top: 4px;
}
.btn-login:hover { background: #0077ED; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,113,227,0.35); }
.btn-login:active { transform: translateY(0); }
.error-msg {
  background: #FFF2F1;
  border: 1px solid rgba(255,59,48,0.25);
  color: #CC2900;
  padding: 10px 14px;
  border-radius: 9px;
  font-size: 13px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-icon">🥟</div>
    <div class="login-title">Mantı Takip</div>
    <div class="login-sub">Üretim & Sevkiyat Sistemi v34</div>

    {% if hata %}
    <div class="error-msg">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6.5" stroke="#CC2900"/><path d="M7 4v3.5M7 9.5v.5" stroke="#CC2900" stroke-width="1.5" stroke-linecap="round"/></svg>
      {{ hata }}
    </div>
    {% endif %}

    <form method="post" action="/login">
      <label class="form-label">Kullanıcı Adı</label>
      <input type="text" name="kullanici" class="form-control" autofocus autocomplete="off" placeholder="Kullanıcı adı">
      <label class="form-label">Şifre</label>
      <input type="password" name="sifre" class="form-control" placeholder="••••••••">
      <button type="submit" class="btn-login">Giriş Yap</button>
    </form>
  </div>
</div>
</body>
</html>
